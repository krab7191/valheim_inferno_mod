## ─────────────────────────────────────────────────────────────────────────────────────────────
## SAMPLE — BepInEx/config/GrundleLord.Inferno.cfg
##
## Inferno writes this file itself on first start. It contains a section for EVERY fuel-burning
## item it finds on your server (vanilla and modded); this sample shows the [General] section and
## four typical items. Edit the real file while the server runs: changes apply within seconds and
## are written to the server log.
##
## Defaults: light sources (torches, sconces, fires, hearths, braziers, lanterns, hot tubs, …) are
## always on. Fuel stations (smelters, furnaces, ovens, …) are vanilla.
## ─────────────────────────────────────────────────────────────────────────────────────────────

## Settings file was created by plugin Inferno v0.1.0
## Plugin GUID: GrundleLord.Inferno

[General]

## Only admins (the server's adminlist.txt) may change Inferno settings. Anyone may turn this on; only admins may turn it off.
# Setting type: Boolean
# Default value: false
AdminOnly = false

## Hide '!fires' chat commands from other players.
# Setting type: Boolean
# Default value: true
HideCommands = true

## Switch lights back on after rain or wind put them out. Note: this also relights lights a player switched off by hand.
# Setting type: Boolean
# Default value: false
IgnoreRain = false

## EXPERIMENTAL. The server keeps ownership of fires, so no player's game burns their fuel or switches them off in rain. Burn rate and schedule become exact. Side effects: no sound when adding fuel or switching these fires; they don't go out in rain. Fires that melt snow or spread fire are excluded. Turning it off gives the fires back immediately.
# Setting type: Boolean
# Default value: false
ServerOwnership = false

[hearth]

## Hearth — light source. Keep fuel full at all times. While on, burn rate and schedule are kept but have no effect (setting either by command switches this off).
# Setting type: Boolean
# Default value: true
AlwaysOn = true

## Fuel burn rate: 0 = vanilla, each step is 10 %. -10 = uses no fuel, 10 = burns twice as fast.
# Setting type: Int32
# Default value: 0
# Acceptable value range: From -10 to 10
BurnRate = 0

## Hour the light turns off.
# Setting type: Int32
# Default value: 0
# Acceptable value range: From 0 to 24
OffTimeHour = 0

## Minute the light turns off.
# Setting type: Int32
# Default value: 0
# Acceptable value range: From 0 to 60
OffTimeMinute = 0

## Hour the light turns on. In-game clock (06:00 = sunrise, 18:00 = sunset). On time = off time means no schedule. Only used when AlwaysOn is false.
# Setting type: Int32
# Default value: 0
# Acceptable value range: From 0 to 24
OnTimeHour = 0

## Minute the light turns on.
# Setting type: Int32
# Default value: 0
# Acceptable value range: From 0 to 60
OnTimeMinute = 0

## Whether this item makes smoke. Only players with the Inferno client mod see the smoke removed; others see vanilla smoke.
# Setting type: Boolean
# Default value: true
Smoke = true

